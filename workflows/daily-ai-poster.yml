name: Generate daily IntelliCore poster

on:
  schedule:
    # 18:30 UTC = 00:00 India Standard Time (next day) every day
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-ai-poster
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate today's image with OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: gpt-image-1.5
        run: python scripts/generate_daily_poster.py

      - name: Commit the new daily image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/daily-posters/daily-art.png
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "chore: refresh daily AI greeting artwork"
            git push
          fi
